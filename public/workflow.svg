<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="workflowTitle workflowDesc">
  <title id="workflowTitle">Flujo de resolución de incidencias</title>
  <desc id="workflowDesc">Diagrama con cuatro etapas: detectar, analizar, resolver y automatizar, con una barra de continuidad operativa.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a2f"/>
    </linearGradient>
    <radialGradient id="glowBrand" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".38"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f5c451" stop-opacity=".22"/>
      <stop offset="1" stop-color="#f5c451" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10" fill="none" stroke="#8b93a7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <clipPath id="card">
      <rect width="800" height="600" rx="32"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="800" height="600" fill="url(#bg)"/>
    <rect width="800" height="600" fill="url(#grid)"/>
    <circle cx="140" cy="150" r="280" fill="url(#glowBrand)"/>
    <circle cx="720" cy="540" r="250" fill="url(#glowAmber)"/>

    <!-- Header -->
    <g transform="translate(40 40)">
      <rect width="210" height="28" rx="14" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".09"/>
      <circle cx="16" cy="14" r="3" fill="#f5c451"/>
      <text x="29" y="18" fill="#cbd0dc" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="1.7">FLUJO DE RESOLUCIÓN</text>
    </g>
    <g transform="translate(618 40)">
      <rect width="142" height="28" rx="14" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-opacity=".22"/>
      <circle cx="15" cy="14" r="3" fill="#34d399"/>
      <text x="26" y="18" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600">Operación en línea</text>
    </g>

    <!-- Stage 1: detect -->
    <g transform="translate(40 142)">
      <rect width="165" height="158" rx="20" fill="#0d1526" fill-opacity=".82" stroke="#ffffff" stroke-opacity=".09"/>
      <rect x="20" y="0" width="46" height="3" rx="1.5" fill="#8b8cf9"/>
      <circle cx="38" cy="44" r="21" fill="#8b8cf9" fill-opacity=".13" stroke="#8b8cf9" stroke-opacity=".28"/>
      <g transform="translate(38 44)" fill="none" stroke="#b9baff" stroke-width="1.7" stroke-linecap="round">
        <circle r="7"/>
        <circle r="2.2" fill="#b9baff" stroke="none"/>
        <path d="M12 0h4M-12 0h-4M0 12v4M0-12v-4"/>
      </g>
      <text x="20" y="93" fill="#f3f5f8" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Detectar</text>
      <text x="20" y="114" fill="#8b93a7" font-family="Segoe UI, Arial, sans-serif" font-size="10.5">Monitoreo continuo</text>
      <rect x="20" y="128" width="62" height="17" rx="8.5" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".07"/>
      <text x="31" y="140" fill="#aab1c2" font-family="Segoe UI, Arial, sans-serif" font-size="8">alertas</text>
    </g>

    <!-- Stage 2: analyze -->
    <g transform="translate(225 142)">
      <rect width="165" height="158" rx="20" fill="#0d1526" fill-opacity=".82" stroke="#ffffff" stroke-opacity=".09"/>
      <rect x="20" y="0" width="46" height="3" rx="1.5" fill="#f5c451"/>
      <circle cx="38" cy="44" r="21" fill="#f5c451" fill-opacity=".13" stroke="#f5c451" stroke-opacity=".28"/>
      <g transform="translate(38 44)" fill="none" stroke="#f8d889" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="m-8-5-6 5 6 5M8-5l6 5-6 5M3-9-3 9"/>
      </g>
      <text x="20" y="93" fill="#f3f5f8" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Analizar</text>
      <text x="20" y="114" fill="#8b93a7" font-family="Segoe UI, Arial, sans-serif" font-size="10.5">Logs · Linux</text>
      <rect x="20" y="128" width="62" height="17" rx="8.5" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".07"/>
      <text x="31" y="140" fill="#aab1c2" font-family="Segoe UI, Arial, sans-serif" font-size="8">causa raíz</text>
    </g>

    <!-- Stage 3: resolve -->
    <g transform="translate(410 142)">
      <rect width="165" height="158" rx="20" fill="#0d1526" fill-opacity=".82" stroke="#ffffff" stroke-opacity=".09"/>
      <rect x="20" y="0" width="46" height="3" rx="1.5" fill="#34d399"/>
      <circle cx="38" cy="44" r="21" fill="#34d399" fill-opacity=".13" stroke="#34d399" stroke-opacity=".28"/>
      <g transform="translate(38 44)" fill="none" stroke="#6ee7b7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle r="9"/>
        <path d="m-4 0 3 3 6-6"/>
      </g>
      <text x="20" y="93" fill="#f3f5f8" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Resolver</text>
      <text x="20" y="114" fill="#8b93a7" font-family="Segoe UI, Arial, sans-serif" font-size="10.5">Soporte · frontend</text>
      <rect x="20" y="128" width="62" height="17" rx="8.5" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".07"/>
      <text x="31" y="140" fill="#aab1c2" font-family="Segoe UI, Arial, sans-serif" font-size="8">seguimiento</text>
    </g>

    <!-- Stage 4: automate -->
    <g transform="translate(595 142)">
      <rect width="165" height="158" rx="20" fill="#0d1526" fill-opacity=".82" stroke="#ffffff" stroke-opacity=".09"/>
      <rect x="20" y="0" width="46" height="3" rx="1.5" fill="#60a5fa"/>
      <circle cx="38" cy="44" r="21" fill="#60a5fa" fill-opacity=".13" stroke="#60a5fa" stroke-opacity=".28"/>
      <g transform="translate(38 44)" fill="none" stroke="#93c5fd" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="m0-10 1.9 5.1L7-3l-5.1 1.9L0 4l-1.9-5.1L-7-3l5.1-1.9L0-10Z"/>
        <path d="m9 5 1 2.6 2.6 1-2.6 1L9 12.2 8 9.6l-2.6-1L8 7.6 9 5Z"/>
      </g>
      <text x="20" y="93" fill="#f3f5f8" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Automatizar</text>
      <text x="20" y="114" fill="#8b93a7" font-family="Segoe UI, Arial, sans-serif" font-size="10.5">IA · Webhooks</text>
      <rect x="20" y="128" width="62" height="17" rx="8.5" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".07"/>
      <text x="31" y="140" fill="#aab1c2" font-family="Segoe UI, Arial, sans-serif" font-size="8">menos manual</text>
    </g>

    <!-- Connectors -->
    <g fill="none" stroke="#8b93a7" stroke-opacity=".35" stroke-width="1.2" stroke-dasharray="3 4" marker-end="url(#arrow)">
      <path d="M205 221h14"/>
      <path d="M390 221h14"/>
      <path d="M575 221h14"/>
    </g>

    <!-- Summary bar -->
    <g transform="translate(40 386)">
      <rect width="720" height="94" rx="22" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".08"/>
      <circle cx="42" cy="38" r="15" fill="#f5c451" fill-opacity=".12" stroke="#f5c451" stroke-opacity=".3"/>
      <path d="m35 38 5 5 9-10" fill="none" stroke="#f5c451" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="68" y="34" fill="#f3f5f8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Continuidad operativa</text>
      <text x="68" y="53" fill="#8b93a7" font-family="Segoe UI, Arial, sans-serif" font-size="10.5">Del síntoma a la causa raíz, sin detener la operación.</text>

      <g font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#b8bfce">
        <rect x="466" y="28" width="54" height="20" rx="10" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".08"/>
        <text x="481" y="42">Zendesk</text>
        <rect x="527" y="28" width="38" height="20" rx="10" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".08"/>
        <text x="542" y="42">SAP</text>
        <rect x="572" y="28" width="42" height="20" rx="10" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".08"/>
        <text x="585" y="42">Linux</text>
        <rect x="621" y="28" width="57" height="20" rx="10" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".08"/>
        <text x="634" y="42">Claude</text>
      </g>

      <g transform="translate(68 65)">
        <rect width="118" height="5" rx="2.5" fill="#ffffff" fill-opacity=".06"/>
        <rect width="89" height="5" rx="2.5" fill="#34d399" fill-opacity=".7"/>
      </g>
      <text x="196" y="70" fill="#6f7789" font-family="Segoe UI, Arial, sans-serif" font-size="8.5">seguimiento documentado</text>
    </g>

    <!-- Decorative details -->
    <g fill="#ffffff" fill-opacity=".14">
      <circle cx="752" cy="118" r="2"/>
      <circle cx="770" cy="118" r="2"/>
      <circle cx="752" cy="136" r="2"/>
      <circle cx="770" cy="136" r="2"/>
    </g>
    <path d="M40 565h720" stroke="#ffffff" stroke-opacity=".06"/>
  </g>
  <rect x=".5" y=".5" width="799" height="599" rx="31.5" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</svg>
